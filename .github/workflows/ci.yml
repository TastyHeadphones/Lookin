name: CI

on:
  push:
    branches: [Develop, main]
  pull_request:
    branches: [Develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spm-resolve:
    name: SPM resolve
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: swift package resolve
        run: swift package resolve

      - name: swift package describe
        run: swift package describe

  ios-build:
    name: iOS build (${{ matrix.configuration }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build LookinServer for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme LookinServer \
            -destination 'generic/platform=iOS Simulator' \
            -configuration ${{ matrix.configuration }} \
            -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  macos-app-unsigned:
    name: macOS app (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: pod install
        run: pod install --repo-update

      - name: Build LookinClient (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Lookin.xcworkspace \
            -scheme LookinClient \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions

  mcp-test:
    name: LookinMCP tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        working-directory: MCP
        run: swift build -c debug

      - name: Test
        working-directory: MCP
        run: swift test --parallel
